<!DOCTYPE html>
<html>

<head>

    <title>Firebase Test</title>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <style>

        body{
            font-family:Arial;
            padding:20px;
            background:#f2f2f2;
        }

        .box{
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.2);
        }

        h2{
            color:green;
        }

        pre{
            background:#eee;
            padding:10px;
            border-radius:5px;
            white-space:pre-wrap;
        }

    </style>

</head>

<body>

    <div class="box">

        <h2>Firebase Connection Test</h2>

        <pre id="output">Starting...</pre>

    </div>

    <script>

        const output = document.getElementById("output");

        function log(message){

            console.log(message);

            output.innerHTML += "\n" + message;
        }


        // FIREBASE CONFIG

        const firebaseConfig = {

            apiKey: "AIzaSyCuY3P3c-Rkk0Dy017wUzNbtaw8zg3JWnE",

            authDomain: "notpad-3d676.firebaseapp.com"          
                
databaseURL: "https://notpad-3d676-default-rtdb.asia-southeast1.firebasedatabase.app",
    
            projectId: "notpad-3d676",

            storageBucket: "notpad-3d676.firebasestorage.app",

            messagingSenderId: "66178659039",

            appId: "1:66178659039:web:35f23f05e092e5c0762f6a"

        };


        try{

            log("Initializing Firebase...");

            firebase.initializeApp(firebaseConfig);

            log("Firebase Initialized Successfully");

        }
        catch(error){

            log("Firebase Init Error:");
            log(error.message);

        }


        const database = firebase.database();


        // TEST WRITE

        log("Trying to WRITE test data...");

        database.ref("test").set({

            message: "Hello Firebase",
            time: new Date().toString()

        })

        .then(()=>{

            log("WRITE SUCCESS");

            // TEST READ

            log("Trying to READ data...");

            return database.ref("test").once("value");

        })

        .then((snapshot)=>{

            log("READ SUCCESS");

            log("DATA RECEIVED:");

            log(JSON.stringify(snapshot.val(), null, 2));

        })

        .catch((error)=>{

            log("FIREBASE ERROR:");

            log(error.message);

            console.log(error);

        });

    </script>

</body>

</html>
