```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Firebase Time Control</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <style>

        body{
            margin:0;
            padding:0;
            background:#f2f2f2;
            font-family:Arial;
        }

        .container{

            width:90%;
            max-width:450px;

            margin:40px auto;

            background:white;

            padding:20px;

            border-radius:10px;

            box-shadow:0px 0px 10px rgba(0,0,0,0.2);
        }

        h2{

            text-align:center;
            color:#333;
        }

        input{

            width:100%;

            padding:12px;

            margin-top:10px;

            border:1px solid #ccc;

            border-radius:5px;

            box-sizing:border-box;

            font-size:16px;
        }

        button{

            width:100%;

            padding:12px;

            margin-top:10px;

            border:none;

            border-radius:5px;

            background:#007bff;

            color:white;

            font-size:16px;

            cursor:pointer;
        }

        button:hover{

            background:#0056b3;
        }

        #output{

            margin-top:20px;

            background:#eee;

            padding:10px;

            border-radius:5px;

            min-height:40px;

            white-space:pre-wrap;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Firebase Time Control</h2>

    <input type="text" id="name" placeholder="Enter Name">

    <input type="password" id="password" placeholder="Enter Password">

    <label>Start Time</label>
    <input type="datetime-local" id="startTime">

    <label>End Time</label>
    <input type="datetime-local" id="endTime">

    <button onclick="insertData()">Insert Record</button>

    <button onclick="updateTime()">Update Time</button>

    <button onclick="getTime()">Retrieve Time</button>

    <button onclick="checkCurrentTime()">Check Current Status</button>

    <div id="output">Ready...</div>

</div>


<script>

    // FIREBASE CONFIG

    const firebaseConfig = {

        apiKey: "YOUR_API_KEY",

        authDomain: "YOUR_AUTH_DOMAIN",

        databaseURL: "YOUR_DATABASE_URL",

        projectId: "YOUR_PROJECT_ID",

        storageBucket: "YOUR_BUCKET",

        messagingSenderId: "YOUR_SENDER_ID",

        appId: "YOUR_APP_ID"
    };


    firebase.initializeApp(firebaseConfig);

    const database = firebase.database();


    function show(message){

        document.getElementById("output").innerHTML = message;

        console.log(message);
    }


    // OPTIONAL TIME OFFSET
    // Example:
    // 2 = add 2 hours
    // -3 = subtract 3 hours

    const TIME_OFFSET_HOURS = 0;


    function applyOffset(date){

        date.setHours(date.getHours() + TIME_OFFSET_HOURS);

        return date;
    }


    function getUTCString(localValue){

        let date = new Date(localValue);

        date = applyOffset(date);

        return date.toISOString();
    }



    // INSERT DATA

    function insertData(){

        let name = document.getElementById("name").value.trim();

        let password = document.getElementById("password").value.trim();

        let startTime = document.getElementById("startTime").value;

        let endTime = document.getElementById("endTime").value;


        if(name === "" || password === "" || startTime === "" || endTime === ""){

            show("Please fill all fields");

            return;
        }


        database.ref("users/" + name).once("value")

        .then((snapshot)=>{

            if(snapshot.exists()){

                show("User already exists");

            }else{

                database.ref("users/" + name).set({

                    password: password,

                    startTime: getUTCString(startTime),

                    endTime: getUTCString(endTime)

                })

                .then(()=>{

                    show("Record Inserted Successfully");

                })

                .catch((error)=>{

                    show("Insert Error : " + error.message);

                });

            }

        });

    }



    // UPDATE TIME

    function updateTime(){

        let name = document.getElementById("name").value.trim();

        let password = document.getElementById("password").value.trim();

        let startTime = document.getElementById("startTime").value;

        let endTime = document.getElementById("endTime").value;


        database.ref("users/" + name).once("value")

        .then((snapshot)=>{

            if(snapshot.exists()){

                let data = snapshot.val();

                if(data.password === password){

                    database.ref("users/" + name).update({

                        startTime: getUTCString(startTime),

                        endTime: getUTCString(endTime)

                    })

                    .then(()=>{

                        show("Time Updated Successfully");

                    });

                }else{

                    show("Wrong Password");
                }

            }else{

                show("User Not Found");
            }

        });

    }



    // RETRIEVE DATA

    function getTime(){

        let name = document.getElementById("name").value.trim();

        database.ref("users/" + name).once("value")

        .then((snapshot)=>{

            if(snapshot.exists()){

                let data = snapshot.val();

                show(

                    "Name : " + name +

                    "\nStart : " + data.startTime +

                    "\nEnd : " + data.endTime
                );

            }else{

                show("User Not Found");
            }

        });

    }



    // CHECK CURRENT STATUS

    function checkCurrentTime(){

        let name = document.getElementById("name").value.trim();

        database.ref("users/" + name).once("value")

        .then((snapshot)=>{

            if(snapshot.exists()){

                let data = snapshot.val();

                let now = new Date();

                now = applyOffset(now);

                let current = now.getTime();

                let start = new Date(data.startTime).getTime();

                let end = new Date(data.endTime).getTime();


                if(current >= start && current <= end){

                    show("ACTIVE TIME");

                }else{

                    show("INACTIVE TIME");
                }

            }else{

                show("User Not Found");
            }

        });

    }

</script>

</body>
</html>
