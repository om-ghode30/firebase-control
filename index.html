<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ESP32 Timer Control</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>

    body{
        margin:0;
        padding:0;
        background:#f2f2f2;
        font-family:Arial;
    }

    .container{

        width:90%;
        max-width:400px;

        margin:50px auto;

        background:white;

        padding:20px;

        border-radius:10px;

        box-shadow:0px 0px 10px rgba(0,0,0,0.2);
    }

    h2{
        text-align:center;
        color:#333;
    }

    input{

        width:100%;

        padding:12px;

        margin-top:10px;

        border:1px solid #ccc;

        border-radius:5px;

        box-sizing:border-box;

        font-size:16px;
    }

    button{

        width:100%;

        padding:12px;

        margin-top:10px;

        border:none;

        border-radius:5px;

        background:#007bff;

        color:white;

        font-size:16px;

        cursor:pointer;
    }

    button:hover{

        background:#0056b3;
    }

    .onBtn{
        background:green;
    }

    .offBtn{
        background:red;
    }

    #output{

        margin-top:20px;

        background:#eee;

        padding:10px;

        border-radius:5px;

        min-height:40px;

        white-space:pre-wrap;
    }

</style>

</head>

<body>

<div class="container">

    <h2>ESP32 Timer Control</h2>

    <input type="password" id="password" placeholder="Enter Password">

    <input type="time" id="start_time">

    <input type="time" id="end_time">

    <button onclick="saveData()">Save Settings</button>

    <button class="onBtn" onclick="manualOn()">Manual ON</button>

    <button class="offBtn" onclick="manualOff()">Manual OFF</button>

    <button onclick="loadData()">Load Current Data</button>

    <div id="output">Ready...</div>

</div>


<script>

    // FIREBASE CONFIG

   // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCuY3P3c-Rkk0Dy017wUzNbtaw8zg3JWnE",
  authDomain: "notpad-3d676.firebaseapp.com",
  databaseURL: "https://notpad-3d676-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "notpad-3d676",
  storageBucket: "notpad-3d676.firebasestorage.app",
  messagingSenderId: "66178659039",
  appId: "1:66178659039:web:35f23f05e092e5c0762f6a",
  measurementId: "G-5L5ZQKGK8M"
};


    // INITIALIZE FIREBASE

    firebase.initializeApp(firebaseConfig);

    const database = firebase.database();


    function show(message){

        document.getElementById("output").innerHTML = message;

        console.log(message);
    }



    // SAVE DATA

    function saveData(){

        let password = document.getElementById("password").value.trim();

        let start_time = document.getElementById("start_time").value;

        let end_time = document.getElementById("end_time").value;


        if(password === "" || start_time === "" || end_time === ""){

            show("Please fill all fields");

            return;
        }


        database.ref("device").once("value")

        .then((snapshot)=>{

            if(snapshot.exists()){

                let data = snapshot.val();

                if(data.password === password){

                    database.ref("device").update({

                        start_time: start_time,
                        end_time: end_time

                    })

                    .then(()=>{

                        show("Settings Updated Successfully");

                    })

                    .catch((error)=>{

                        show("Update Error : " + error.message);

                    });

                }else{

                    show("Wrong Password");

                }

            }else{

                // FIRST TIME INSERT

                database.ref("device").set({

                    password: password,
                    start_time: start_time,
                    end_time: end_time,
                    manual_on: false

                })

                .then(()=>{

                    show("Device Created Successfully");

                })

                .catch((error)=>{

                    show("Insert Error : " + error.message);

                });

            }

        })

        .catch((error)=>{

            show("Firebase Error : " + error.message);

        });

    }



    // MANUAL ON

    function manualOn(){

        database.ref("device").update({

            manual_on: true

        })

        .then(()=>{

            show("Manual ON Enabled");

        })

        .catch((error)=>{

            show(error.message);

        });

    }



    // MANUAL OFF

    function manualOff(){

        database.ref("device").update({

            manual_on: false

        })

        .then(()=>{

            show("Manual OFF Enabled");

        })

        .catch((error)=>{

            show(error.message);

        });

    }



    // LOAD CURRENT DATA

    function loadData(){

        database.ref("device").once("value")

        .then((snapshot)=>{

            if(snapshot.exists()){

                let data = snapshot.val();

                show(

                    "Start Time : " + data.start_time +

                    "\nEnd Time : " + data.end_time +

                    "\nManual ON : " + data.manual_on

                );

            }else{

                show("No Device Data Found");

            }

        })

        .catch((error)=>{

            show(error.message);

        });

    }

</script>

</body>

</html>
